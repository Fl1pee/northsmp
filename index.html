<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NorthSMP - Minecraft сервер</title>
<meta name="description" content="NorthSMP - Український Майнкрафт Сервер!">
<link rel="icon" href="logo.png" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body id="top">

<header class="site-header">
  <div class="header-inner">
    <a href="#top" class="brand" id="brandLink">
      <img src="logo.png" alt="NorthSMP" class="brand-logo">
      <span class="brand-text">
        <span class="brand-name">North<span class="accent">SMP</span></span>
        <span class="brand-sub" data-i18n="brand.sub"></span>
      </span>
    </a>

    <nav class="main-nav" id="mainNav">
      <span class="nav-indicator" id="navIndicator" aria-hidden="true"></span>
      <a href="#home" class="nav-pill" data-i18n="nav.home"></a>
      <a href="#about" class="nav-pill" data-i18n="nav.about"></a>
      <a href="#team" class="nav-pill" data-i18n="nav.team"></a>
      <a href="#donate" class="nav-pill" data-i18n="nav.donate"></a>
      <a href="#faq" class="nav-pill" data-i18n="nav.faq"></a>
      <a href="#contacts" class="nav-pill" data-i18n="nav.contacts"></a>
    </nav>

    <div class="header-controls">
      <button class="icon-toggle spotlight-card" id="langToggle" aria-label="Change language" data-i18n-title="controls.lang">
        <span id="langToggleText">EN</span>
      </button>
      <button class="icon-toggle spotlight-card" id="themeToggle" aria-label="Toggle theme" data-i18n-title="controls.theme">
        <span class="theme-icon theme-icon-sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8 6 18M18 6l1.8-1.8"/></svg></span>
        <span class="theme-icon theme-icon-moon" style="display:none"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg></span>
      </button>
      <button class="burger" id="burgerBtn" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<section class="hero" id="home">
  <div class="hero-inner">
    <img src="logo.png" alt="" class="hero-side-logo reveal">

    <div class="hero-text">
      <h1 class="hero-title reveal">
        <span data-i18n="hero.title1"></span>
        <span class="hero-title-accent" data-i18n="hero.title2"></span>
      </h1>
      <p class="hero-subtitle reveal" data-i18n="hero.subtitle"></p>

      <div class="hero-actions reveal">
      <div class="hero-ip-pill" id="ipBtnHero" role="button" tabindex="0">
        <span class="hero-ip-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="4" rx="1"/><path d="M8 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-2"/></svg></span>
        <span>IP: <code>north.mcbuild.fun</code></span>
        <span class="hero-ip-dot" aria-hidden="true">•</span>
        <span>Purpur</span>
        <span class="hero-ip-dot" aria-hidden="true">•</span>
        <span>1.21.10</span>
      </div>

      <a href="#donate" class="btn btn-primary spotlight-card">
        <span data-i18n="hero.join"></span>
      </a>
      </div>
    </div>
  </div>

  <a href="#about" class="scroll-down" aria-label="Scroll to about">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
  </a>
</section>

<div class="status-strip reveal">
  <div class="status-strip-inner">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusValueText" data-i18n="status.checking"></span>
    <span class="status-strip-sep" aria-hidden="true">•</span>
    <span data-i18n="status.players"></span>:
    <span id="playersValue">-</span>
  </div>
</div>

<section class="section" id="about">
  <div class="section-inner">
    <h2 class="section-title reveal" data-i18n="about.title"></h2>

    <div class="feature-grid">
      <article class="feature-card spotlight-card reveal">
        <div class="feature-icon-box">
          <img src="images/feature-1.png" alt="" loading="lazy">
        </div>
        <h3 data-i18n="about.f1.title"></h3>
        <p data-i18n="about.f1.text"></p>
      </article>

      <article class="feature-card spotlight-card reveal">
        <div class="feature-icon-box">
          <img src="images/feature-2.png" alt="" loading="lazy">
        </div>
        <h3 data-i18n="about.f2.title"></h3>
        <p data-i18n="about.f2.text"></p>
      </article>

      <article class="feature-card spotlight-card reveal">
        <div class="feature-icon-box">
          <img src="images/feature-3.png" alt="" loading="lazy">
        </div>
        <h3 data-i18n="about.f3.title"></h3>
        <p data-i18n="about.f3.text"></p>
      </article>

      <article class="feature-card spotlight-card reveal">
        <div class="feature-icon-box">
          <img src="images/feature-4.png" alt="" loading="lazy">
        </div>
        <h3 data-i18n="about.f4.title"></h3>
        <p data-i18n="about.f4.text"></p>
      </article>
    </div>
  </div>
</section>

<section class="section section-alt" id="team">
  <div class="section-inner section-inner-center">
    <h2 class="section-title reveal" data-i18n="team.title"></h2>
    <div class="team-grid" id="teamGrid"></div>
  </div>
</section>

<section class="section" id="donate">
  <div class="section-inner">
    <div class="cta-grid">
      <div class="cta-card spotlight-card reveal">
        <div class="cta-icon">
          <img src="images/cta-join.png" alt="" loading="lazy">
        </div>
        <h3 data-i18n="donate.joinTitle"></h3>
        <p data-i18n="donate.joinText"></p>
        <a href="https://discord.com/invite/XdEPbvGeKm" target="_blank" rel="noopener noreferrer" class="btn btn-primary btn-block">
          <span data-i18n="donate.joinCta"></span>
        </a>
      </div>

      <div class="cta-card spotlight-card reveal">
        <div class="cta-icon">
          <img src="images/cta-donate.png" alt="" loading="lazy">
        </div>
        <h3 data-i18n="donate.title"></h3>
        <p data-i18n="donate.text"></p>
        <a href="https://donatello.to/Fl1pee" target="_blank" rel="noopener noreferrer" class="btn btn-primary btn-block">
          <span data-i18n="donate.cta"></span>
        </a>
      </div>
    </div>
  </div>
</section>

<section class="section section-alt" id="faq">
  <div class="section-inner section-inner-center">
    <h2 class="section-title reveal" data-i18n="faq.title"></h2>

    <div class="accordion" id="accordion">
      <div class="accordion-item spotlight-card reveal">
        <button class="accordion-header" aria-expanded="false">
          <span class="accordion-q" data-i18n="faq.q1"></span>
          <span class="accordion-plus"></span>
        </button>
        <div class="accordion-body">
          <p data-i18n="faq.a1"></p>
        </div>
      </div>

      <div class="accordion-item spotlight-card reveal">
        <button class="accordion-header" aria-expanded="false">
          <span class="accordion-q" data-i18n="faq.q2"></span>
          <span class="accordion-plus"></span>
        </button>
        <div class="accordion-body">
          <p data-i18n="faq.a2"></p>
        </div>
      </div>

      <div class="accordion-item spotlight-card reveal">
        <button class="accordion-header" aria-expanded="false">
          <span class="accordion-q" data-i18n="faq.q3"></span>
          <span class="accordion-plus"></span>
        </button>
        <div class="accordion-body">
          <p data-i18n="faq.a3"></p>
        </div>
      </div>

      <div class="accordion-item spotlight-card reveal">
        <button class="accordion-header" aria-expanded="false">
          <span class="accordion-q" data-i18n="faq.q4"></span>
          <span class="accordion-plus"></span>
        </button>
        <div class="accordion-body">
          <p data-i18n="faq.a4"></p>
        </div>
      </div>

      <div class="accordion-item spotlight-card reveal">
        <button class="accordion-header" aria-expanded="false">
          <span class="accordion-q" data-i18n="faq.q5"></span>
          <span class="accordion-plus"></span>
        </button>
        <div class="accordion-body">
          <p data-i18n="faq.a5"></p>
        </div>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer" id="contacts">
  <div class="footer-inner">
    <div class="footer-cols">
      <div class="footer-col reveal">
        <span class="footer-col-title" data-i18n="footer.col.contacts"></span>
        <a href="https://discord.com/invite/XdEPbvGeKm" target="_blank" rel="noopener noreferrer" data-i18n="footer.discord"></a>
        <a href="https://t.me/NorthSMP_UA" target="_blank" rel="noopener noreferrer">Telegram</a>
        <a href="https://www.tiktok.com/@northsmp_ua" target="_blank" rel="noopener noreferrer">TikTok</a>
      </div>
      <div class="footer-col reveal">
        <span class="footer-col-title" data-i18n="footer.col.project"></span>
        <a href="#about" data-i18n="nav.about"></a>
        <a href="#team" data-i18n="nav.team"></a>
        <a href="#faq" data-i18n="nav.faq"></a>
      </div>
      <div class="footer-col reveal">
        <span class="footer-col-title" data-i18n="footer.col.media"></span>
        <a href="https://www.youtube.com/@NorthSMP_UA" target="_blank" rel="noopener noreferrer">YouTube канал</a>
        <a href="https://donatello.to/Fl1pee" target="_blank" rel="noopener noreferrer" data-i18n="nav.donate"></a>
      </div>
    </div>

    <div class="footer-divider" aria-hidden="true"></div>

    <div class="footer-bottom">
      <div class="footer-bottom-brand">
        <img src="logo.png" alt="NorthSMP" class="footer-logo">
        <p class="footer-copy">© <span id="footerYear"></span> NorthSMP. <span data-i18n="footer.rights"></span></p>
      </div>
      <p class="footer-eon"><span data-i18n="footer.eon.prefix"></span> <span class="eon-text">EON</span></p>
    </div>
    <p class="footer-disclaimer muted" data-i18n="footer.sys"></p>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span class="toast-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
  <span id="toastText"></span>
</div>

<button id="scrollTopBtn" class="scroll-top-btn" aria-label="Scroll to top">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>
