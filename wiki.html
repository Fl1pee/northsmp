<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вікі NorthSMP</title><meta name="theme-color" content="#0a0816"><link rel="icon" href="logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="wiki">
<canvas id="snow" aria-hidden="true"></canvas><div class="grain" aria-hidden="true"></div>
<div id="siteNavigation"></div>
<div class="content-shell">
<main class="content-card content-card--simple wiki-article">
<h1 data-page-i18n="heading">Вікі</h1>
<div class="wiki-tabs" role="tablist" aria-label="Розділи вікі">
  <button type="button" class="wiki-tab active" role="tab" id="tab-recipes" aria-controls="panel-recipes" aria-selected="true" data-tab="recipes">Рецепти</button>
  <button type="button" class="wiki-tab" role="tab" id="tab-story" aria-controls="panel-story" aria-selected="false" tabindex="-1" data-tab="story">Сюжет</button>
  <button type="button" class="wiki-tab" role="tab" id="tab-mechanics" aria-controls="panel-mechanics" aria-selected="false" tabindex="-1" data-tab="mechanics">Механіка</button>
</div>
<section class="wiki-panel" role="tabpanel" id="panel-recipes" aria-labelledby="tab-recipes" data-panel="recipes">
  <h2 data-wiki-i18n="recipesTitle">Рецепти</h2>
  <div class="recipe-search">
    <input type="search" id="recipeSearch" placeholder="Пошук рецепта..." aria-label="Пошук рецепта" autocomplete="off">
  </div>
  <div class="recipe-list" id="recipeList"></div>
  <p class="recipe-empty" id="recipeEmpty" hidden>Нічого не знайдено.</p>
</section>
<section class="wiki-panel" role="tabpanel" id="panel-story" aria-labelledby="tab-story" data-panel="story" hidden>
  <h2 data-wiki-i18n="storyTitle">Сюжет</h2>
  <p data-wiki-i18n="storyText">0 епізод вже йде...</p>
</section>
<section class="wiki-panel" role="tabpanel" id="panel-mechanics" aria-labelledby="tab-mechanics" data-panel="mechanics" hidden>
  <h2 data-wiki-i18n="mechanicsTitle">Механіка</h2>
  <p data-wiki-i18n="mechanicsText">Поки що гравці не написали адмінам про знайдену механіку...</p>
</section>
</main>
<footer>© NorthSMP · 2026–2027</footer>
</div>
<script src="navigation.js"></script><script src="content.js"></script><script src="recipes.js"></script><script src="wiki-tabs.js"></script><script src="snowflakes.js"></script>
</body></html>
